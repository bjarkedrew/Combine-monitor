name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.8
          channel: stable
          cache: true
      - name: Generate Android runner
        run: flutter create --platforms=android --project-name combine_monitor .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Render dashboard screenshot
        run: |
          mkdir -p test/fonts
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/Roboto-Regular.ttf" test/fonts/Roboto-Regular.ttf
          flutter test --update-goldens --dart-define=GENERATE_GOLDEN=true test/dashboard_golden_test.dart
      - name: Upload dashboard screenshot
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-v0.2
          path: app/test/goldens/dashboard-v0.2.png
          if-no-files-found: error
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: combine-monitor-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
